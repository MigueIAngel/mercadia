# Backing services for local development: run the apps with `npm run dev` on the host.
name: mercadia-infra

services:
  mongo:
    # Atlas Local = MongoDB + Atlas Search / Vector Search, same features as the cloud M0.
    image: mongodb/mongodb-atlas-local:8
    # A fixed hostname keeps the single-node replica set valid across restarts.
    hostname: mongodb
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db, mongoconfig:/data/configdb]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mercadia
      POSTGRES_PASSWORD: mercadia
      POSTGRES_DB: mercadia
    ports: ["5433:5432"] # 5433 so it does not clash with a local PostgreSQL
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercadia"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    # Catches every email the platform sends: http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  jaeger:
    # Distributed traces: http://localhost:16686 (OTLP on 4318)
    image: jaegertracing/jaeger:latest
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    # Dashboards: http://localhost:3030 (anonymous admin, local only)
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3030:3000"]

volumes:
  mongodata:
  mongoconfig:
  pgdata:
  redisdata:
